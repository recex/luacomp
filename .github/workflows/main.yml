name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        shell: bash
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luacomp-build
          path: |
            build/libs/*.jar
            build.log
